# One monthly PR for all minor and patch updates, so one CI run and no bun.lock
# conflicts between PRs. Major updates come one PR each.
# .github/workflows/dependabot-auto-merge.yml merges minor and patch PRs once
# the full Check passes, then deploys. Majors wait for a person.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    # Skip releases younger than 7 days: a compromised or broken release is
    # usually pulled within that time. Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Pinned together to one workerd version for Windows. See the pin note in README.md.
      - dependency-name: wrangler
      - dependency-name: "@cloudflare/vite-plugin"
      - dependency-name: "@cloudflare/vitest-plugin"
      # The pinned Node runtime (scripts/node.ts) and its types stay on Node 24.
      - dependency-name: node-linux-x64
        update-types: ["version-update:semver-major"]
      - dependency-name: node-win-x64
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
