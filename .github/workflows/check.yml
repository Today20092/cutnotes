name: Check

on:
  push:
    branches: [main, development, "integration/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run audit
      - run: bun run build
      # The build rewrites the route tree. A diff means someone hand-edited or forgot to commit it.
      - run: git diff --exit-code src/routeTree.gen.ts
      - if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || github.base_ref == 'main'
        run: bun scripts/node.ts node_modules/@playwright/test/cli.js install --with-deps chromium
      - if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || github.base_ref == 'main'
        run: bun run test:seam2
