name: Deploy

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [development]
  workflow_dispatch:
    inputs:
      environment:
        description: Target install (run from development for staging, main for production)
        type: choice
        options: [staging, production]
        default: staging
      staging_reviewed:
        description: Production only - real-service staging checks passed for this release
        type: boolean
        default: false
      recovery_point:
        description: Production only - D1 recovery point or backup reference
        type: string

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.select.outputs.environment }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Select a passing current branch commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTED_SHA: ${{ github.sha }}
          REQUESTED_REF: ${{ github.ref }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_REVIEWED: ${{ inputs.staging_reviewed }}
          RECOVERY_POINT: ${{ inputs.recovery_point }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then
            target=staging
            sha="$CHECKED_SHA"
          else
            target="$REQUESTED_ENVIRONMENT"
            sha="$REQUESTED_SHA"
          fi
          case "$target" in
            staging) branch=development ;;
            production)
              branch=main
              test "$STAGING_REVIEWED" = true
              test -n "$RECOVERY_POINT"
              ;;
            *) exit 1 ;;
          esac
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$REQUESTED_REF" = "refs/heads/$branch"
          fi
          current=$(gh api "repos/$REPOSITORY/branches/$branch" --jq .commit.sha)
          test "$sha" = "$current"
          gh api "repos/$REPOSITORY/actions/workflows/check.yml/runs?head_sha=$sha&event=push&per_page=10" \
            --jq '.workflow_runs[0].conclusion' | grep -qx success
          echo "environment=$target" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: candidate
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.candidate.outputs.environment }}
      url: ${{ vars.APP_ORIGIN }}
    concurrency:
      group: deploy-${{ needs.candidate.outputs.environment }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.candidate.outputs.environment }}
      RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.${{ needs.candidate.outputs.environment }}.jsonc
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require deployment credentials and a current candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$VITE_CLERK_PUBLISHABLE_KEY"
          case "$TARGET" in staging) branch=development ;; production) branch=main ;; *) exit 1 ;; esac
          test "$RELEASE_SHA" = "$(gh api "repos/$REPOSITORY/branches/$branch" --jq .commit.sha)"
          jq -e --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg origin "$APP_ORIGIN" \
            '.account_id == $account and .vars.APP_ORIGIN == $origin' "$CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH"
      - run: bun install --frozen-lockfile
      - name: Require runtime secrets before mutating data
        run: |
          set -euo pipefail
          bun scripts/node.ts node_modules/wrangler/bin/wrangler.js secret list \
            --config "$CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH" > "$RUNNER_TEMP/runtime-secrets.json"
          jq -e 'map(.name) as $names | ["CLERK_SECRET_KEY", "CLERK_PUBLISHABLE_KEY", "CLERK_JWT_KEY", "MUX_TOKEN_ID", "MUX_TOKEN_SECRET", "MUX_WEBHOOK_SECRET", "MUX_SIGNING_KEY_ID", "MUX_SIGNING_PRIVATE_KEY"] | all(. as $name | $names | index($name) != null)' "$RUNNER_TEMP/runtime-secrets.json"
      - run: bun run build
      - name: Check generated deployment target
        run: |
          set -euo pipefail
          git diff --exit-code src/routeTree.gen.ts
          generated=$(jq -r .configPath .wrangler/deploy/config.json)
          generated="$(dirname .wrangler/deploy/config.json)/$generated"
          expected=$(jq -r .name "$CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH")
          database=$(jq -r '.d1_databases[0].database_id' "$CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH")
          jq -e --arg expected "$expected" --arg database "$database" \
            --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg origin "$APP_ORIGIN" \
            '.name == $expected and .account_id == $account and .vars.APP_ORIGIN == $origin and .d1_databases[0].database_id == $database' "$generated"
      - name: Apply additive migrations to the selected database
        run: bun scripts/node.ts node_modules/wrangler/bin/wrangler.js d1 migrations apply DB --remote --config "$CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH"
      - name: Deploy the built Worker
        run: bun scripts/node.ts node_modules/wrangler/bin/wrangler.js deploy
      - name: Check service response
        run: curl --fail --silent --show-error --retry 4 --retry-delay 5 "$APP_ORIGIN/api/team" --output /dev/null
      - name: Record release
        if: always()
        env:
          RECOVERY_POINT: ${{ inputs.recovery_point }}
        run: |
          printf 'Environment: %s\nCommit: %s\nOrigin: %s\nRecovery point: %s\n' "$TARGET" "$RELEASE_SHA" "$APP_ORIGIN" "$RECOVERY_POINT" >> "$GITHUB_STEP_SUMMARY"
